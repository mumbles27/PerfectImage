name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  lint-test:
    name: fmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest patch release so govulncheck sees a fixed stdlib.
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet (linux)
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: go test -race
        # -race requires cgo.
        env:
          CGO_ENABLED: "1"
        run: (umask 077; go test -race -count=1 ./...)

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest patch release so govulncheck sees a fixed stdlib.
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # Latest patch release so govulncheck sees a fixed stdlib.
          go-version: stable
          check-latest: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="$(git describe --tags --always --dirty)"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/perfectimage-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/perfectimage
      - uses: actions/upload-artifact@v5
        with:
          name: perfectimage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  packer-validate:
    name: packer validate (catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-packer@v3
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: packer init / validate -syntax-only / fmt -check
        run: |
          status=0
          for d in catalog/images/*/; do
            echo "::group::${d}"
            # Run inside the image directory so ${path.root} resolves like a build workdir.
            (cd "$d" && packer init . && packer validate -syntax-only . && packer fmt -check .) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: perfectimage catalog validate
        run: go run ./cmd/perfectimage catalog validate --no-embedded --dir catalog
      - name: packer validate rendered templates
        # Renders every starter image with apps injected and runs a full
        # `packer validate` (fake credentials, no Proxmox access needed).
        env:
          PERFECTIMAGE_PACKER_VALIDATE: "1"
        run: go test -count=1 -run 'TestRenderedTemplatesValidate|TestRenderGolden' -v ./internal/packer
