id: docker
name: Docker
category: container
description: Container engine (Docker Desktop on Windows, Docker Engine on Linux).
homepage: https://www.docker.com
reboot_required: true
install:
  windows:
    - winget:
        id: Docker.DockerDesktop
      verify: 'if (Test-Path "$env:ProgramFiles\Docker\Docker\Docker Desktop.exe") { exit 0 } else { exit 1 }'
    - choco:
        package: docker-desktop
      verify: 'if (Test-Path "$env:ProgramFiles\Docker\Docker\Docker Desktop.exe") { exit 0 } else { exit 1 }'
  linux:
    - apt:
        packages: [docker.io]
      verify: command -v docker
    - shell:
        script: |
          dnf -y install dnf-plugins-core &&
            dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo &&
            dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin &&
            systemctl enable --now docker
      distros: [rhel]
      verify: command -v docker
    - shell:
        script: |
          curl -fsSL -o /tmp/get-docker.sh https://get.docker.com &&
            sh /tmp/get-docker.sh &&
            systemctl enable --now docker
      verify: command -v docker
