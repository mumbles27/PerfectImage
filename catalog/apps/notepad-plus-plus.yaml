id: notepad-plus-plus
name: Notepad++
category: utility
description: Source-code and text editor for Windows.
homepage: https://notepad-plus-plus.org
install:
  windows:
    - winget:
        id: Notepad++.Notepad++
      verify: 'if (Test-Path "$env:ProgramFiles\Notepad++\notepad++.exe") { exit 0 } else { exit 1 }'
    - choco:
        package: notepadplusplus
      verify: 'if (Test-Path "$env:ProgramFiles\Notepad++\notepad++.exe") { exit 0 } else { exit 1 }'
