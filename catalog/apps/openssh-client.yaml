id: openssh-client
name: OpenSSH Client
category: utility
description: OpenSSH secure shell client (ssh, scp, sftp).
homepage: https://www.openssh.com
install:
  windows:
    - powershell:
        script: |
          Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 -ErrorAction Stop | Out-Null
      verify: 'if (Test-Path "$env:SystemRoot\System32\OpenSSH\ssh.exe") { exit 0 } else { exit 1 }'
  linux:
    - apt:
        packages: [openssh-client]
      verify: command -v ssh
    - dnf:
        packages: [openssh-clients]
      verify: command -v ssh
