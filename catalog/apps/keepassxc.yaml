id: keepassxc
name: KeePassXC
category: security
description: Cross-platform offline password manager.
homepage: https://keepassxc.org
install:
  windows:
    - winget:
        id: KeePassXCTeam.KeePassXC
      verify: 'if (Test-Path "$env:ProgramFiles\KeePassXC\KeePassXC.exe") { exit 0 } else { exit 1 }'
    - choco:
        package: keepassxc
      verify: 'if (Test-Path "$env:ProgramFiles\KeePassXC\KeePassXC.exe") { exit 0 } else { exit 1 }'
  linux:
    - apt:
        packages: [keepassxc]
      verify: command -v keepassxc
    - shell:
        script: |
          dnf -y install epel-release &&
            dnf -y install keepassxc
      distros: [rhel]
      verify: command -v keepassxc
    - flatpak:
        id: org.keepassxc.KeePassXC
      verify: flatpak info org.keepassxc.KeePassXC >/dev/null 2>&1
