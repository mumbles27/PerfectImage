id: python
name: Python 3
category: dev
description: Python 3 interpreter with pip.
homepage: https://www.python.org
install:
  windows:
    - winget:
        id: Python.Python.3.14
      verify: 'if (Get-ChildItem -Path "$env:ProgramFiles\Python3*\python.exe", "$env:SystemDrive\Python3*\python.exe" -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }'
    - choco:
        package: python3
      verify: 'if (Get-ChildItem -Path "$env:ProgramFiles\Python3*\python.exe", "$env:SystemDrive\Python3*\python.exe" -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }'
  linux:
    - apt:
        packages: [python3, python3-pip, python3-venv]
      verify: command -v python3
    - dnf:
        packages: [python3, python3-pip]
      verify: command -v python3
