{{define "head"}}<link rel="stylesheet" href="/auth/static/auth.css">{{end}}
{{define "content"}}
<div class="auth-box">
  <h1>Change your password</h1>
  <p class="muted">You must choose a new password before continuing. Use at least {{.Data.MinLength}} characters; common passwords are rejected.</p>
  {{with .Data.Error}}<div class="flash flash-err" role="alert">{{.}}</div>{{end}}
  <form method="post" action="/login/password" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <input type="hidden" name="username" value="{{.Data.User.Username}}" autocomplete="username">
    <label>Current (one-time) password
      <input type="password" name="current_password" autocomplete="current-password" required autofocus>
    </label>
    <label>New password
      <input type="password" name="new_password" autocomplete="new-password" minlength="{{.Data.MinLength}}" required>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="{{.Data.MinLength}}" required>
    </label>
    <button type="submit">Change password</button>
  </form>
</div>
{{end}}
