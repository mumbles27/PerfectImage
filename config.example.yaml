# PerfectImage example configuration.
#
# Relative paths are resolved against the directory containing this file.
# Production defaults (when a key is omitted):
#   data_dir: /var/lib/perfectimage (Linux) or %ProgramData%\PerfectImage (Windows)
#   config:   /etc/perfectimage/config.yaml or %ProgramData%\PerfectImage\config.yaml
#
# This example uses ./data so `go run ./cmd/perfectimage serve --config config.example.yaml`
# works from a checkout without root. Never commit secrets to this file: credentials
# (Proxmox tokens, SIEM keys) are entered in the UI and sealed in the database.

data_dir: ./data

server:
  # HTTPS is on by default. With no cert_file/key_file a self-signed
  # certificate is generated in <data_dir>/tls on first run.
  listen: "127.0.0.1:8443"
  shutdown_timeout: 30s
  # public_url: https://perfectimage.example.com
  tls:
    cert_file: ""
    key_file: ""
    # Extra SANs for the generated certificate.
    self_signed_hosts: []
    # disable: true   # plain HTTP, only allowed on loopback listeners

database:
  # Defaults to <data_dir>/perfectimage.db
  path: ""
  busy_timeout: 5s

log:
  level: info            # debug | info | warn | error
  file: ""               # default <data_dir>/logs/perfectimage.log; "-" disables
  max_size_mb: 50
  max_backups: 5
  stdout: true

jobs:
  workers: 2
  poll_interval: 2s

catalog:
  dirs:
    - ./catalog

secrets:
  # Default <data_dir>/secrets/master.key (0600) on Linux,
  # <data_dir>\secrets\master.key.dpapi (DPAPI, machine scope) on Windows.
  key_file: ""

auth:
  # DEVELOPMENT ONLY: treat every request as an administrator. Only accepted
  # when server.listen is a loopback address. Until the auth module lands,
  # set this to true locally to browse the UI.
  dev_allow_all: false
  session_ttl: 8h

proxmox:
  clusters: []
  # - name: lab
  #   endpoint: https://pve.example.com:8006/api2/json
  #   ca_file: /etc/perfectimage/pve-ca.pem

packer:
  binary: ""      # default: "packer" from PATH
  work_dir: ""    # default <data_dir>/packer

siem:
  # Audit log retention (0 keeps events forever) and write buffer size.
  audit_retention: 8760h
  audit_queue_size: 4096
  spill_dir: ""          # default <data_dir>/siem (per-output on-disk backlog)
  # Credentials (HEC token, API key, password, HMAC secret) are entered on
  # /settings/siem and sealed in the database, never configured here.
  outputs: []
  # - name: central-syslog
  #   type: syslog              # syslog | cef | splunk_hec | elastic | webhook | file
  #   address: tls://siem.example.com:6514   # udp:// | tcp:// (octet counting) | tls://
  #   ca_file: /etc/perfectimage/siem-ca.pem
  #   cert_file: ""             # client certificate for mutual TLS
  #   key_file: ""
  #   facility: local0
  #   streams: [audit, logs]    # default both
  #   min_level: warn           # minimum application log level forwarded
  # - name: splunk
  #   type: splunk_hec
  #   url: https://splunk.example.com:8088
  #   index: perfectimage
  #   sourcetype: perfectimage:json
  # - name: elastic
  #   type: elastic             # Elasticsearch or OpenSearch _bulk
  #   url: https://es.example.com:9200
  #   index: logs-perfectimage-default
  #   username: ""              # set for basic auth; empty uses an API key
  # - name: webhook
  #   type: webhook
  #   url: https://hooks.example.com/perfectimage
  #   headers: {X-Tenant: lab}
  # - name: local-json
  #   type: file
  #   path: ./data/siem/events.jsonl
  #   max_size_mb: 100
  #   max_files: 5
  # Per-output tuning (defaults shown): queue_size: 1000, batch_size: 100,
  # flush_interval: 2s, timeout: 10s, max_backoff: 5m, spill_max_mb: 64
  # (-1 disables spilling), disabled: false.

backup:
  dir: ""                # default <data_dir>/backups
  retention: 7           # scheduled and pre-restore archives kept (each)
  schedule: ""           # cron, e.g. "0 2 * * *" or "@daily"; empty = manual only
  copy_to: ""            # optional second directory or UNC path (\\server\share\pi)
  # Include the host master key (encrypted with the backup passphrase) so
  # sealed credentials can be restored on a new host. See docs/backup.md.
  include_master_key: true
  max_upload_mb: 2048    # restore upload limit on /settings/backup
